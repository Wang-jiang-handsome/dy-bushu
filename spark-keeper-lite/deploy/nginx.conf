# =============================================================================
#  spark-keeper · Nginx HTTPS 反向代理示例
#
#  放置：/etc/nginx/conf.d/spark.conf（conf.d/*.conf 是在 http{} 里 include 的，
#        所以下面的 map / limit_req_zone 写在文件顶部是合法的）
#
#  前置：
#    1. 域名 A 记录解析到服务器
#    2. 证书：certbot --nginx -d spark.example.com
#       （或把 ssl_certificate 指向自己的证书；自签名也能跑，浏览器会警告）
#    3. 后端只监听 127.0.0.1:8000（见 docker-compose 的 SK_BIND），
#       公网流量一律经这里进来，才能有真实 IP、HTTPS 与限流
# =============================================================================

# WebSocket 升级（浏览器长连接/后续扩展用）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 边缘限流：单 IP 每秒 20 个请求，突发 60（应用内还有一层更细的限流）
limit_req_zone $binary_remote_addr zone=spark_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=spark_conn:10m;

upstream spark_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# --- HTTP：只做跳转，顺带放行 ACME 校验 ---
server {
    listen 80;
    listen [::]:80;
    server_name spark.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS 主站 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name spark.example.com;

    ssl_certificate     /etc/letsencrypt/live/spark.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spark.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # 注意：确认全站 HTTPS 正常后再开 HSTS，否则回退很麻烦
    add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 上传头像/截图需要，和 http_server.MAX_BODY 保持一致
    client_max_body_size 10m;
    client_body_timeout 60s;

    # 登录态文件与日志不进访问日志的 query（避免把 token 写进日志）
    access_log /var/log/nginx/spark.access.log;
    error_log  /var/log/nginx/spark.error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 静态资源：带 hash 的产物可以长缓存 ----
    location /assets/ {
        proxy_pass http://spark_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location /static/ {
        proxy_pass http://spark_backend;
        proxy_set_header Host $host;
        expires 1d;
    }

    # ---- 支付回调：单独放宽限流（渠道会重试，被限流会丢单） ----
    location /api/v1/pay/ {
        limit_req zone=spark_api burst=120 nodelay;
        proxy_pass http://spark_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- 接口 ----
    location /api/ {
        limit_req  zone=spark_api burst=60 nodelay;
        limit_conn spark_conn 30;
        proxy_pass http://spark_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;          # 浏览器自动化接口可能长时间无输出
    }

    # ---- 前端 SPA（hash 路由，不需要 rewrite） ----
    location / {
        proxy_pass http://spark_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
