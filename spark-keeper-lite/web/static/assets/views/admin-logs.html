<page-head title="运行与审计日志"
           sub="运行日志用于排查故障；审计日志记录管理员与关键用户动作，两者都可按条件检索。">
  <button class="btn btn--sm" @click="tab === 'run' ? load() : loadAudit()"
          :disabled="loading || audit.loading">
    <icon name="refresh" :size="14" :class="{ spin: loading || audit.loading }"></icon> 刷新
  </button>
  <button class="btn btn--sm btn--danger" @click="prune" :disabled="pruning">
    <icon name="trash" :size="14"></icon> 清理历史日志
  </button>
</page-head>

<div class="card">
  <div class="tabs">
    <button class="tab" :class="{ 'is-active': tab === 'run' }" @click="switchTab('run')">运行日志</button>
    <button class="tab" :class="{ 'is-active': tab === 'audit' }" @click="switchTab('audit')">
      审计日志<span class="tag tag--muted" style="margin-left:6px">{{ audit.total || 0 }}</span>
    </button>
  </div>

  <!-- 运行日志 -->
  <template v-if="tab === 'run'">
    <div class="toolbar">
      <div class="field">
        <label class="field__label">来源范围</label>
        <span class="select-wrap">
          <select class="select" v-model="filters.scope" @change="search">
            <option v-for="o in scopeOptions" :key="o.value" :value="o.value">{{ o.label }}</option>
          </select>
        </span>
      </div>
      <div class="field">
        <label class="field__label">级别</label>
        <span class="select-wrap">
          <select class="select" v-model="filters.level" @change="search">
            <option v-for="o in levelOptions" :key="o.value" :value="o.value">{{ o.label }}</option>
          </select>
        </span>
      </div>
      <div class="field">
        <label class="field__label">模块</label>
        <input class="input" v-model="filters.source" placeholder="如 task.runner" @keyup.enter="search"
               style="width:150px" />
      </div>
      <div class="field toolbar__grow">
        <label class="field__label">关键字</label>
        <input class="input" v-model="filters.keyword" placeholder="日志内容" @keyup.enter="search" />
      </div>
      <div class="field">
        <label class="field__label">开始日期</label>
        <input class="input" type="date" v-model="filters.start_date" @change="search" />
      </div>
      <div class="field">
        <label class="field__label">结束日期</label>
        <input class="input" type="date" v-model="filters.end_date" @change="search" />
      </div>
      <div class="toolbar__actions">
        <button class="btn btn--sm" @click="search"><icon name="search" :size="13"></icon> 查询</button>
        <button class="btn btn--sm btn--ghost" @click="reset">重置</button>
      </div>
    </div>

    <div class="card__body">
      <div v-if="loading"><loading text="正在加载日志…"></loading></div>
      <alert type="error" :message="error" v-else-if="error">
        <span>{{ error }}</span>
        <button class="link-btn" style="margin-left:8px" @click="load">重试</button>
      </alert>
      <empty-state v-else-if="!items.length" icon="list" title="没有符合条件的日志"
                   hint="调整筛选条件（例如把级别设为「错误」只看异常）。"></empty-state>
      <template v-else>
        <div class="fs-12 text-muted mb-8">第 {{ page }} 页，共 {{ total }} 条</div>
        <div class="log-line" v-for="row in items" :key="row.id">
          <div class="log-line__time">
            <time-text :value="row.created_at" mode="minute"></time-text>
          </div>
          <div style="flex:0 0 auto"><status-tag kind="level" :value="row.level"></status-tag></div>
          <div class="log-line__msg">
            <div>{{ row.message }}</div>
            <div class="log-line__src">
              <span class="tag tag--muted">{{ statusText('scope', row.scope) }}</span>
              <span v-if="row.source"> · {{ row.source }}</span>
              <span v-if="row.username"> · {{ row.username }}</span>
              <span v-else-if="row.user_id"> · 用户 #{{ row.user_id }}</span>
              <button class="link-btn" style="margin-left:8px" @click="toggle(row)">
                {{ expanded[row.id] ? '收起' : '上下文' }}
              </button>
            </div>
            <pre class="code-block mt-8" v-if="expanded[row.id]">{{ contextText(row) }}</pre>
          </div>
        </div>
      </template>
    </div>

    <pager :page="page" :pages="pages" :total="total" :page-size="pageSize"
           @change="p => { page = p; load(); }" @size="s => { pageSize = s; page = 1; load(); }"></pager>
  </template>

  <!-- 审计日志 -->
  <template v-else>
    <div class="toolbar">
      <div class="field toolbar__grow">
        <label class="field__label">关键字</label>
        <input class="input" v-model="audit.keyword" placeholder="动作 / 目标 / 操作人"
               @keyup.enter="audit.page = 1; loadAudit()" />
      </div>
      <div class="toolbar__actions">
        <button class="btn btn--sm" @click="audit.page = 1; loadAudit()">
          <icon name="search" :size="13"></icon> 查询</button>
        <button class="btn btn--sm btn--ghost" @click="audit.keyword = ''; audit.page = 1; loadAudit()">
          重置</button>
      </div>
    </div>

    <data-table :loading="audit.loading" :error="audit.error" :empty="!audit.items.length" :colspan="6"
                empty-title="暂无审计记录"
                empty-hint="管理员的关键操作会自动记录在这里。"
                @retry="loadAudit">
      <template #head>
        <thead>
          <tr>
            <th>时间</th><th>操作人</th><th>范围</th><th>动作</th><th>目标</th><th>详情 / IP</th>
          </tr>
        </thead>
      </template>
      <tr v-for="row in audit.items" :key="row.id">
        <td class="nowrap">
          <time-text :value="row.created_at" mode="minute"></time-text>
          <div class="row-sub">{{ agoText(row.created_at) }}</div>
        </td>
        <td>
          {{ row.username || '—' }}
          <div class="row-sub" v-if="row.user_id">#{{ row.user_id }}</div>
        </td>
        <td><status-tag kind="scope" :value="row.scope" :dot="false"></status-tag></td>
        <td class="is-mono">{{ row.action || '—' }}</td>
        <td class="is-mono"><span class="ellipsis" :title="row.target">{{ row.target || '—' }}</span></td>
        <td>
          <span class="ellipsis" :title="row.detail">{{ row.detail || '—' }}</span>
          <div class="row-sub">
            <span v-if="row.ip" class="is-mono">{{ row.ip }}</span>
            <span v-if="row.user_agent" class="fs-12"> · {{ row.user_agent.slice(0, 40) }}</span>
          </div>
        </td>
      </tr>
    </data-table>
    <pager :page="audit.page" :pages="audit.pages" :total="audit.total" :page-size="audit.pageSize"
           @change="p => { audit.page = p; loadAudit(); }"
           @size="s => { audit.pageSize = s; audit.page = 1; loadAudit(); }"></pager>
  </template>
</div>
