<page-head title="执行记录"
           sub="每次自动/手动执行都会留下记录，包含每个好友的结果与截图，可用于排查失败原因。">
  <button class="btn btn--sm" @click="load" :disabled="loading">
    <icon name="refresh" :size="14" :class="{ spin: loading }"></icon> 刷新
  </button>
</page-head>

<div class="card">
  <div class="toolbar">
    <div class="field">
      <label class="field__label">账号</label>
      <span class="select-wrap">
        <select class="select" v-model="filters.account_id" @change="search">
          <option value="">全部账号</option>
          <option v-for="a in accounts" :key="a.id" :value="a.id">
            {{ a.nickname || a.remark || ('账号 #' + a.id) }}
          </option>
        </select>
      </span>
    </div>
    <div class="field">
      <label class="field__label">状态</label>
      <span class="select-wrap">
        <select class="select" v-model="filters.status" @change="search">
          <option v-for="o in statusOptions" :key="o.value" :value="o.value">{{ o.label }}</option>
        </select>
      </span>
    </div>
    <div class="field">
      <label class="field__label">开始日期</label>
      <input class="input" type="date" v-model="filters.start_date" @change="search" />
    </div>
    <div class="field">
      <label class="field__label">结束日期</label>
      <input class="input" type="date" v-model="filters.end_date" @change="search" />
    </div>
    <div class="toolbar__actions">
      <button class="btn btn--sm" @click="search"><icon name="search" :size="13"></icon> 查询</button>
      <button class="btn btn--sm btn--ghost" @click="reset">重置</button>
    </div>
  </div>

  <data-table :loading="loading" :error="error" :empty="!items.length" :colspan="7"
              empty-title="还没有执行记录"
              empty-hint="任务跑过一次之后，这里会显示每次执行的结果。"
              @retry="load">
    <template #head>
      <thead>
        <tr>
          <th>执行时间</th><th>账号</th><th>触发</th><th>状态</th>
          <th class="is-num">成功 / 总数</th><th class="is-num">耗时</th><th class="is-actions">操作</th>
        </tr>
      </thead>
    </template>
    <tr v-for="row in items" :key="row.id">
      <td class="nowrap">
        <time-text :value="row.started_at" mode="minute"></time-text>
        <div class="row-sub">{{ agoText(row.started_at) }}</div>
      </td>
      <td>{{ accountName(row) }}</td>
      <td><status-tag kind="trigger" :value="row.trigger_type" :dot="false"></status-tag></td>
      <td>
        <status-tag kind="run" :value="row.status"></status-tag>
        <div class="row-sub" v-if="row.error_code">{{ row.error_code }}</div>
      </td>
      <td class="is-num">
        <span class="text-success">{{ row.success_count || 0 }}</span>
        <span class="text-muted"> / {{ row.total_count || 0 }}</span>
        <div class="row-sub" v-if="row.fail_count">
          <span class="text-danger">失败 {{ row.fail_count }}</span>
        </div>
      </td>
      <td class="is-num">{{ fmt.duration(row.duration_ms) }}</td>
      <td class="is-actions">
        <button class="btn btn--sm btn--soft" @click="openDetail(row.id)">
          <icon name="eye" :size="13"></icon> 详情</button>
      </td>
    </tr>
  </data-table>

  <pager :page="page" :pages="pages" :total="total" :page-size="pageSize"
         @change="p => { page = p; load(); }" @size="s => { pageSize = s; page = 1; load(); }"></pager>
</div>

<!-- 执行详情 -->
<drawer v-model="showDetail" size="lg" title="执行详情"
        :sub="detail && detail.started_at ? ('开始于 ' + timeText(detail.started_at)) : ''">
  <div v-if="detailLoading"><loading text="正在加载执行详情…"></loading></div>
  <alert type="error" :message="detailError" v-if="detailError">
    <span>{{ detailError }}</span>
    <button class="link-btn" style="margin-left:8px" @click="openDetail(route.params.id)">重试</button>
  </alert>

  <template v-if="detail && !detailLoading">
    <div class="flex-between mb-12">
      <div class="flex-gap">
        <status-tag kind="run" :value="detail.status"></status-tag>
        <status-tag kind="trigger" :value="detail.trigger_type" :dot="false"></status-tag>
        <span class="tag tag--muted" v-if="detail.run_date">{{ detail.run_date }}</span>
      </div>
      <button class="btn btn--sm" v-if="detail.task_id" @click="runAgain" :disabled="acting">
        <icon name="play" :size="13"></icon> 重跑该任务
      </button>
    </div>

    <div class="card">
      <div class="card__body">
        <div class="desc desc--wide">
          <div class="desc__k">账号</div>
          <div class="desc__v">{{ detail.account_nickname || accountName(detail) }}</div>
          <div class="desc__k">开始时间</div>
          <div class="desc__v"><time-text :value="detail.started_at" mode="time"></time-text></div>
          <div class="desc__k">结束时间</div>
          <div class="desc__v"><time-text :value="detail.finished_at" mode="time"></time-text></div>
          <div class="desc__k">耗时</div>
          <div class="desc__v">{{ fmt.duration(detail.duration_ms) }}</div>
          <div class="desc__k">好友结果</div>
          <div class="desc__v">
            总数 {{ detail.total_count || 0 }} ·
            <span class="text-success">成功 {{ detail.success_count || 0 }}</span> ·
            <span :class="detail.fail_count ? 'text-danger' : 'text-muted'">失败 {{ detail.fail_count || 0 }}</span>
          </div>
          <div class="desc__k">说明</div>
          <div class="desc__v">{{ detail.message || '—' }}</div>
          <div class="desc__k">错误码</div>
          <div class="desc__v" v-if="detail.error_code">{{ detail.error_code }}</div>
          <div class="desc__k" v-else>错误码</div>
          <div class="desc__v" v-if="!detail.error_code">—</div>
        </div>
      </div>
    </div>

    <div class="section-title">每个好友的结果</div>
    <data-table :loading="false" :error="''" :empty="!detailItems.length" :colspan="4"
                empty-title="本次没有好友明细"
                empty-hint="可能是任务被跳过，或执行时好友列表为空。">
      <template #head>
        <thead><tr><th>好友</th><th>状态</th><th>实际发送内容</th><th>截图 / 错误</th></tr></thead>
      </template>
      <tr v-for="(item, i) in detailItems" :key="item.id || i">
        <td>
          <span class="row-title">{{ item.friend_name || '—' }}</span>
          <div class="row-sub" v-if="item.duration_ms">{{ fmt.duration(item.duration_ms) }}</div>
        </td>
        <td><status-tag kind="item" :value="item.status"></status-tag></td>
        <td><span class="ellipsis" :title="item.message">{{ item.message || '—' }}</span></td>
        <td>
          <img v-if="shots[item.id || item.friend_name]" class="thumb"
               :src="shots[item.id || item.friend_name]"
               @click="openShot(shots[item.id || item.friend_name])" alt="执行截图" />
          <!-- 成功行也可能带 error_detail（那里存的是「发送方式」如 CDP insertText + Enter）。
               以前不分状态一律按失败渲染 → 成功行显示「失败: CDP insertText...」，误导用户。 -->
          <span v-else-if="item.status !== 'success' && (item.error_detail || item.error_code)"
                class="text-danger fs-12" :title="item.error_detail">
            {{ item.error_code || '失败' }}<span v-if="item.error_detail">：{{ item.error_detail }}</span>
          </span>
          <span v-else-if="item.status === 'success' && item.error_detail" class="text-muted fs-12">
            {{ item.error_detail }}
          </span>
          <span v-else class="text-muted fs-12">无截图</span>
        </td>
      </tr>
    </data-table>

    <template v-if="detailShots.length">
      <div class="section-title mt-16">本次执行截图（{{ detailShots.length }} 张）</div>
      <div class="shot-grid">
        <template v-for="(name, i) in detailShots" :key="'run-' + i">
          <img v-if="shots['run-' + i]" class="thumb" :src="shots['run-' + i]"
               @click="openShot(shots['run-' + i])" alt="执行截图" />
        </template>
      </div>
      <div class="fs-12 text-muted">截图加载失败或缺失时不显示缩略图，不影响记录本身的可用性。</div>
    </template>
  </template>

  <template #foot>
    <button class="btn" @click="showDetail = false">关闭</button>
  </template>
</drawer>

<!-- 截图放大 -->
<div class="overlay" v-if="showShot" @click.self="showShot = false">
  <img class="thumb--lg" :src="shotUrl" alt="执行截图" />
</div>
